name: Proves

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves de les eines musicals i construcció de l'instal·lador visual de cada sistema.
  proves:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Eines musicals
        run: uv sync
      - name: Proves (les que necessiten MuseScore o Audiveris s'ometen si no hi són)
        run: uv run pytest -q
      - name: Ordre per una canonada amb consola cp1252 (cas de Windows)
        env:
          PYTHONIOENCODING: cp1252
        run: uv run partitures --help

      - name: Construir «Instal·lar Arranjaments.app» (Mac, universal)
        if: runner.os == 'macOS'
        run: |
          set -x
          bash instalacio/visual/mac/construir.sh "$RUNNER_TEMP/visual"
          APP="$RUNNER_TEMP/visual/Instal·lar Arranjaments.app"
          lipo -archs "$APP/Contents/MacOS/InstalarArranjaments" | grep arm64 | grep x86_64
          codesign --verify --deep --strict "$APP"
          mkdir -p "$RUNNER_TEMP/captures"
          # Prova de la finestra sense instal·lar res (passos simulats): un cas bo i un amb error
          "$APP/Contents/MacOS/InstalarArranjaments" --prova --auto --captura "$RUNNER_TEMP/captures/mac-prova.png"
          if "$APP/Contents/MacOS/InstalarArranjaments" --prova-error --auto --captura "$RUNNER_TEMP/captures/mac-prova-error.png"; then
            echo "El mode amb error hauria d'eixir amb codi 1"; exit 1
          fi
          test -s "$RUNNER_TEMP/captures/mac-prova.png"
          # tar i no ZIP: conserva els permisos d'execució de l'aplicació
          tar -C "$RUNNER_TEMP/visual" -cf "$RUNNER_TEMP/instalador-mac.tar" "Instal·lar Arranjaments.app"
      - name: Construir «Instal·lar Arranjaments.exe» (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & instalacio\visual\windows\construir.ps1 -Eixida "$env:RUNNER_TEMP\visual"
          $exe = @(Get-ChildItem "$env:RUNNER_TEMP\visual\Instal*.exe")[0]
          Write-Host "Construït: $($exe.Name) ($($exe.Length) bytes)"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\captures" | Out-Null
          # Prova de la finestra sense instal·lar res (passos simulats): un cas bo i un amb error
          $p = Start-Process $exe.FullName -ArgumentList "--prova --auto --captura `"$env:RUNNER_TEMP\captures\windows-prova.png`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El mode de prova ha eixit amb codi $($p.ExitCode)" }
          $p = Start-Process $exe.FullName -ArgumentList "--prova-error --auto --captura `"$env:RUNNER_TEMP\captures\windows-prova-error.png`"" -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "El mode amb error hauria d'eixir amb codi 1, no $($p.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\captures\windows-prova.png")) { throw "No s'ha guardat la captura" }
          Copy-Item $exe.FullName "$env:RUNNER_TEMP\instalador-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ runner.os }}
          path: |
            ${{ runner.temp }}/instalador-mac.tar
            ${{ runner.temp }}/instalador-windows.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-prova-${{ runner.os }}
          path: ${{ runner.temp }}/captures/
          if-no-files-found: warn

  # Els fitxers que baixa la professora, un per sistema: Arranjaments-Windows.exe i Arranjaments-LliureX.run (aquí), i
  # Arranjaments-Mac.dmg (al job paquet-mac, perquè cal un Mac). Tots porten el projecte a dins, amb la versió ja posada.
  # A més, arranjaments.zip (el de sempre, per si algú el vol) i els fitxers de l'actualització automàtica.
  paquet:
    needs: proves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador-*
          path: peces
          merge-multiple: true
      - name: Muntar la carpeta i fer el ZIP
        run: |
          set -x
          mkdir muntatge
          git archive HEAD | tar -x -C muntatge
          # Versió: «major.menor» del fitxer VERSION i el número d'execució de GitHub (sempre creix)
          BASE="$(cut -d. -f1,2 VERSION)"
          VERSIO="$BASE.$GITHUB_RUN_NUMBER"
          echo "$VERSIO" > muntatge/VERSION
          echo "Versió: $VERSIO"
          # El projecte (sense proves ni imatges del README) per a incrustar-lo als fitxers d'un sol clic
          python3 instalacio/visual/paquets.py projecte muntatge projecte.zip projecte.tar.gz
          test "$(tar -xzOf projecte.tar.gz VERSION)" = "$VERSIO"
          python3 instalacio/visual/paquets.py windows peces/instalador-windows.exe projecte.zip Arranjaments-Windows.exe
          python3 instalacio/visual/paquets.py linux instalacio/visual/linux/capcalera.sh projecte.tar.gz Arranjaments-LliureX.run
          test -x Arranjaments-LliureX.run
          test "$(tail -c 8 Arranjaments-Windows.exe)" = "ARRPAYL1"
          head -c 2 Arranjaments-Windows.exe | grep -q MZ
          ls -la Arranjaments-Windows.exe Arranjaments-LliureX.run projecte.tar.gz
          # Paquet petit per a l'actualització automàtica (només eines i configuració) i el fitxer que en diu la versió i el sha256
          PYTHONPATH=muntatge/scripts python3 -m partitures.actualitzar --fes-paquet muntatge "$VERSIO" "$PWD"
          cat versio.json
          python3 -c "import json,hashlib;d=json.load(open('versio.json'));assert d['sha256']==hashlib.sha256(open('actualitzacio.zip','rb').read()).hexdigest()"
          tar -xf peces/instalador-mac.tar -C muntatge
          cp peces/instalador-windows.exe "muntatge/Instal·lar Arranjaments.exe"
          test -x "muntatge/Instal·lar Arranjaments.app/Contents/MacOS/InstalarArranjaments"
          python3 instalacio/visual/empaqueta.py muntatge arranjaments.zip
          unzip -l arranjaments.zip | head -40
          ls -la arranjaments.zip
      - uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: |
            arranjaments.zip
            actualitzacio.zip
            versio.json
            Arranjaments-Windows.exe
            Arranjaments-LliureX.run
            projecte.tar.gz
          if-no-files-found: error

  # Arranjaments-Mac.dmg: «Instal·lar Arranjaments.app» amb el projecte a dins (cal macOS per a hdiutil i codesign)
  paquet-mac:
    needs: paquet
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: instalador-macOS
          path: peces
      - uses: actions/download-artifact@v4
        with:
          name: paquets
          path: paquets
      - name: Fer el DMG
        run: |
          set -x
          mkdir app
          tar -xf peces/instalador-mac.tar -C app
          bash instalacio/visual/mac/fes-dmg.sh "app/Instal·lar Arranjaments.app" paquets/projecte.tar.gz Arranjaments-Mac.dmg
          ls -la Arranjaments-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: Arranjaments-Mac.dmg
          if-no-files-found: error

  # Prova real de l'experiència de la professora: baixar Arranjaments-Mac.dmg (a una carpeta amb accents i espais), obrir-lo
  # i obrir «Instal·lar Arranjaments» des del volum de només lectura (aquí, amb --auto: instal·la sense prémer res).
  # Després, mirar que tot hi és. macos-latest és Apple Silicon (arm64) i macos-15-intel és Intel (x86_64).
  instalacio-mac:
    needs: [paquet, paquet-mac]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: ${{ runner.temp }}
      - name: Obrir el DMG com ho fa el Mac (volum de només lectura), des d'una carpeta amb accents i espais
        run: |
          set -x
          uname -m
          mkdir -p "$HOME/Prova àè amb espais"
          cp "$RUNNER_TEMP/Arranjaments-Mac.dmg" "$HOME/Prova àè amb espais/"
          hdiutil attach -readonly -nobrowse -quiet "$HOME/Prova àè amb espais/Arranjaments-Mac.dmg"
          VOL="/Volumes/Arranjaments"
          ls -la "$VOL"
          test "$(ls "$VOL")" = "Instal·lar Arranjaments.app"
          APP="$VOL/Instal·lar Arranjaments.app"
          test -x "$APP/Contents/MacOS/InstalarArranjaments"
          test -s "$APP/Contents/Resources/projecte.tar.gz"
          lipo -archs "$APP/Contents/MacOS/InstalarArranjaments" | grep arm64 | grep x86_64
          codesign --verify --deep --strict "$APP"
          # el volum és de només lectura: res s'hi pot escriure
          if touch "$VOL/prova" 2>/dev/null; then echo "El volum hauria de ser de només lectura"; exit 1; fi
          # fitxers de referència (el que hauria d'acabar a l'ordinador): els de l'actualització
          mkdir -p "$RUNNER_TEMP/ref"
          unzip -q "$RUNNER_TEMP/actualitzacio.zip" -d "$RUNNER_TEMP/ref"
          echo "REF=$RUNNER_TEMP/ref" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/captures"
      - name: Instal·lar amb l'aplicació visual (la mateixa que obri la professora, des del DMG)
        run: |
          codi=0
          "$APP/Contents/MacOS/InstalarArranjaments" --auto \
            --registre "$RUNNER_TEMP/captures/mac-registre.txt" --captura "$RUNNER_TEMP/captures/mac-instalacio.png" || codi=$?
          echo "Codi d'eixida: $codi"
          grep -q "RESULTAT: tot a punt" "$RUNNER_TEMP/captures/mac-registre.txt"
          ! grep -q "@@" "$RUNNER_TEMP/captures/mac-registre.txt"
          exit $codi
      - name: La carpeta de treball només té entrada i eixida; les eines queden amagades a part
        run: |
          set -x
          W="$HOME/Documents/Arranjaments"
          D="$HOME/Library/Application Support/Arranjaments"
          ls -la "$W" "$W/.opencode" "$D"
          test "$(ls "$W" | sort | tr '\n' ' ')" = "eixida entrada "
          test "$(ls -A "$W" | sort | tr '\n' ' ')" = ".opencode eixida entrada "
          test -f "$W/.opencode/opencode.json"
          cmp "$W/.opencode/AGENTS.md" "$REF/AGENTS.md"
          test -f "$W/.opencode/skills/arranjar/SKILL.md"
          test -x "$D/.venv/bin/python"
          test -d "$D/scripts/partitures"
          test -x "$HOME/.local/bin/partitures"
          # la còpia temporal del projecte (de dins de l'aplicació) ja no hi és
          test ! -e "$D/staging"
          # una partitura de la professora: en repetir l'instal·lador no s'ha de tocar
          echo "partitura de la professora" > "$W/eixida/no-tocar.txt"
          echo "vell" > "$W/.opencode/AGENTS.md"
      - name: Repetir l'aplicació no ha de fer res nou, ni fallar, ni tocar les partitures
        run: |
          codi=0
          "$APP/Contents/MacOS/InstalarArranjaments" --auto --registre "$RUNNER_TEMP/captures/mac-registre2.txt" || codi=$?
          echo "Codi d'eixida: $codi"
          grep -q "RESULTAT: tot a punt" "$RUNNER_TEMP/captures/mac-registre2.txt"
          grep -q "OpenCode ja està instal·lat" "$RUNNER_TEMP/captures/mac-registre2.txt"
          grep -q "MuseScore ja està instal·lat" "$RUNNER_TEMP/captures/mac-registre2.txt"
          ! grep -q "@@" "$RUNNER_TEMP/captures/mac-registre2.txt"
          W="$HOME/Documents/Arranjaments"
          test "$(cat "$W/eixida/no-tocar.txt")" = "partitura de la professora"
          test "$(ls -A "$W/eixida")" = "no-tocar.txt"
          cmp "$W/.opencode/AGENTS.md" "$REF/AGENTS.md"
          test "$(ls -A "$W" | sort | tr '\n' ' ')" = ".opencode eixida entrada "
          test ! -e "$HOME/Library/Application Support/Arranjaments/staging"
          exit $codi
      - name: Comprovar el resultat
        run: |
          set -x
          test -d "$HOME/Applications/OpenCode.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$HOME/Applications/OpenCode.app/Contents/Info.plist")" = "ai.opencode.desktop"
          ls -d "$HOME"/Applications/MuseScore*.app
          test -d "$HOME/Desktop/Arranjaments.app"
          test -x "$HOME/Desktop/Arranjaments.app/Contents/MacOS/applet"
          codesign -v "$HOME/Desktop/Arranjaments.app"
          ! xattr -r "$HOME/Desktop/Arranjaments.app" | grep -q quarantine
          ! xattr "$HOME/Applications/OpenCode.app" | grep -q quarantine
      - name: Obrir l'aplicació visual del DMG com amb doble clic (informatiu)
        continue-on-error: true
        run: |
          open -n "$APP" --args --auto --registre "$RUNNER_TEMP/captures/mac-registre-open.txt"
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/captures/mac-registre-open.txt" ] && break; sleep 2; done
          pkill -x InstalarArranjaments || true
          cat "$RUNNER_TEMP/captures/mac-registre-open.txt"
          grep -q "RESULTAT: tot a punt" "$RUNNER_TEMP/captures/mac-registre-open.txt"
      - name: Obrir la icona de l'Escriptori i veure que arrenca OpenCode
        continue-on-error: true
        run: |
          open "$HOME/Desktop/Arranjaments.app"
          for i in $(seq 1 20); do pgrep -x OpenCode >/dev/null && break; sleep 2; done
          pgrep -x OpenCode
          pkill -x OpenCode || true
      - name: Actualització silenciosa (simulada), fitxers de la professora intactes i tornar enrere
        run: |
          set -ex
          W="$HOME/Documents/Arranjaments"
          D="$HOME/Library/Application Support/Arranjaments"
          PY="$D/.venv/bin/python"
          osadecompile "$HOME/Desktop/Arranjaments.app" | grep -q "partitures.actualitzar"
          test "$(cat "$D/VERSION")" = "$(cat "$REF/VERSION")"
          V0="$(cat "$D/VERSION")"
          # el paquet «nou»: el real, amb una marca i una versió molt alta
          F="$RUNNER_TEMP/fals"; rm -rf "$F" "$RUNNER_TEMP/servidor" "$RUNNER_TEMP/servidor-mal"; mkdir -p "$F"
          unzip -q "$RUNNER_TEMP/actualitzacio.zip" -d "$F"
          echo "marca" > "$F/scripts/partitures/marca_prova.txt"
          echo "LINIA-DE-PROVA" >> "$F/AGENTS.md"
          "$PY" -m partitures.actualitzar --fes-paquet "$F" 99.0.0 "$RUNNER_TEMP/servidor"
          echo "partitura de la professora" > "$W/eixida/no-tocar.txt"
          # sha256 incorrecte: es rebutja i no canvia res
          cp -R "$RUNNER_TEMP/servidor" "$RUNNER_TEMP/servidor-mal"
          "$PY" -c "import json,sys;p=sys.argv[1];d=json.load(open(p));d['sha256']='0'*64;json.dump(d,open(p,'w'))" "$RUNNER_TEMP/servidor-mal/versio.json"
          if ARRANJAMENTS_ACTUALITZACIO_URL="file://$RUNNER_TEMP/servidor-mal" "$HOME/.local/bin/partitures" actualitzar; then echo "Hauria de rebutjar-ho"; exit 1; fi
          test "$(cat "$D/VERSION")" = "$V0"
          # sense internet: la icona obri igualment, sense error
          ARRANJAMENTS_ACTUALITZACIO_URL="file:///no/hi/ha/res" "$PY" -I -m partitures.actualitzar --silenci
          grep -q "Sense connexió" "$D/actualitzacio.log"
          test "$(cat "$D/VERSION")" = "$V0"
          # la mateixa ordre que executa la icona
          ARRANJAMENTS_ACTUALITZACIO_URL="file://$RUNNER_TEMP/servidor" "$PY" -I -m partitures.actualitzar --silenci
          test "$(cat "$D/VERSION")" = "99.0.0"
          test -f "$D/scripts/partitures/marca_prova.txt"
          test -f "$D/anterior/ESTAT.json"
          grep -q "LINIA-DE-PROVA" "$W/.opencode/AGENTS.md"
          test -f "$W/.opencode/NOVETATS.md"
          test "$(cat "$W/eixida/no-tocar.txt")" = "partitura de la professora"
          test "$(ls -A "$W" | sort | tr '\n' ' ')" = ".opencode eixida entrada "
          test "$(ls -A "$W/.opencode" | sort | tr '\n' ' ')" = "AGENTS.md NOVETATS.md opencode.json skills "
          P() { env -i HOME="$HOME" PATH=/usr/bin:/bin "$HOME/.local/bin/partitures" "$@"; }
          P versio | grep -q "99.0.0"
          P comprovar
          # tornar enrere
          P actualitzar --torna-enrere
          test "$(cat "$D/VERSION")" = "$V0"
          test ! -e "$D/scripts/partitures/marca_prova.txt"
          ! grep -q "LINIA-DE-PROVA" "$W/.opencode/AGENTS.md"
          cmp "$W/.opencode/AGENTS.md" "$REF/AGENTS.md"
          test "$(cat "$W/eixida/no-tocar.txt")" = "partitura de la professora"
          P comprovar
          # i la icona no torna a posar la versió que s'ha rebutjat
          ARRANJAMENTS_ACTUALITZACIO_URL="file://$RUNNER_TEMP/servidor" "$PY" -I -m partitures.actualitzar --silenci
          test "$(cat "$D/VERSION")" = "$V0"
      - name: Sense el DMG, les ordres funcionen des de la carpeta de treball
        run: |
          set -x
          hdiutil detach -quiet "/Volumes/Arranjaments" || true
          rm -rf "$HOME/Prova àè amb espais"
          cd "$HOME/Documents/Arranjaments"
          # com ho fa l'ajudant dins d'OpenCode: amb un entorn mínim, sense uv al PATH
          P() { env -i HOME="$HOME" PATH=/usr/bin:/bin "$HOME/.local/bin/partitures" "$@"; }
          P comprovar
          P corpus bach --copia 1
          ls entrada
          P info "entrada/bwv101.7.musicxml"
          P transport "entrada/bwv101.7.musicxml" --semitons 2
          test -f "eixida/bwv101.7-transportat.musicxml"
          # mai fora d'entrada i eixida
          if P transport "entrada/bwv101.7.musicxml" --semitons 2 --eixida "../fora.musicxml"; then echo "Ha escrit fora"; exit 1; fi
          test ! -e ../fora.musicxml
          P instalar --prova
          test "$(cat eixida/no-tocar.txt)" = "partitura de la professora"
          test "$(ls -A | sort | tr '\n' ' ')" = ".opencode eixida entrada "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-instalacio-${{ matrix.os }}
          path: ${{ runner.temp }}/captures/
          if-no-files-found: warn

  # Windows: baixar Arranjaments-Windows.exe (a una carpeta amb accents i espais) i obrir-lo. Es prova a x64 (windows-latest) i
  # a Windows 11 ARM64 (windows-11-arm, que és ARM de veritat: el .exe corre natiu i OpenCode s'instal·la en la versió ARM64).
  instalacio-windows:
    needs: paquet
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets
          path: ${{ runner.temp }}
      - name: Preparar l'únic fitxer baixat, en una carpeta amb accents i espais (i els fitxers de referència)
        shell: pwsh
        run: |
          $dest = "C:\Prova àè amb espais"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:RUNNER_TEMP\Arranjaments-Windows.exe" $dest
          Get-ChildItem $dest | ForEach-Object { Write-Host "$($_.Name) ($($_.Length) bytes)" }
          Write-Host "Sistema: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture), procés: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          Expand-Archive "$env:RUNNER_TEMP\actualitzacio.zip" "$env:RUNNER_TEMP\ref"
          Add-Content $env:GITHUB_ENV "ARRANJAMENTS=$dest"
          Add-Content $env:GITHUB_ENV "REF=$env:RUNNER_TEMP\ref"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\captures" | Out-Null
      - name: Instal·lar amb el programa visual (el mateix que obri la professora)
        shell: pwsh
        run: |
          $exe = Get-Item "$env:ARRANJAMENTS\Arranjaments-Windows.exe"
          $reg = "$env:RUNNER_TEMP\captures\windows-registre.txt"
          $p = Start-Process $exe.FullName -ArgumentList "--auto --registre `"$reg`" --captura `"$env:RUNNER_TEMP\captures\windows-instalacio.png`"" -Wait -PassThru
          if (Test-Path $reg) { Get-Content $reg -Encoding UTF8 }
          Write-Host "Codi d'eixida: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "L'instal·lador visual ha eixit amb codi $($p.ExitCode)" }
          $text = Get-Content $reg -Raw -Encoding UTF8
          if ($text -notmatch "RESULTAT: tot a punt") { throw "El registre no diu «tot a punt»" }
          if ($text -match "@@") { throw "Els avisos de progrés no s'han de veure al registre" }
          if ($text -notmatch "instal·lat") { throw "Els accents del registre no s'han llegit bé" }
      - name: La carpeta de treball només té entrada i eixida; les eines queden amagades a part
        shell: pwsh
        run: |
          $W = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Arranjaments"
          $D = Join-Path $env:LOCALAPPDATA "Arranjaments"
          Write-Host "Carpeta de treball: $W"
          $visibles = (Get-ChildItem $W | Sort-Object Name | ForEach-Object Name) -join " "
          $totes = (Get-ChildItem $W -Force | Sort-Object Name | ForEach-Object Name) -join " "
          Write-Host "Visibles: $visibles / totes: $totes"
          if ($visibles -ne "eixida entrada") { throw "A la carpeta de treball només s'han de veure entrada i eixida: $visibles" }
          if ($totes -ne ".opencode eixida entrada") { throw "Contingut inesperat: $totes" }
          if (-not ((Get-Item "$W\.opencode" -Force).Attributes -band [IO.FileAttributes]::Hidden)) { throw ".opencode no està amagada" }
          foreach ($f in @("$W\.opencode\opencode.json", "$W\.opencode\AGENTS.md", "$W\.opencode\skills\arranjar\SKILL.md",
                           "$D\.venv\Scripts\python.exe", "$D\scripts\partitures\cli.py", "$env:USERPROFILE\.local\bin\partitures.cmd")) {
              if (-not (Test-Path $f)) { throw "Falta $f" }
          }
          if (Test-Path "$D\staging") { throw "La còpia temporal del projecte no s'ha esborrat" }
          if (@(Get-ChildItem $env:ARRANJAMENTS).Count -ne 1) { throw "L'instal·lador ha deixat fitxers al costat de l'.exe" }
          if (([Environment]::GetEnvironmentVariable('Path','User') -split ';') -notcontains "$env:USERPROFILE\.local\bin") { throw "La carpeta de l'ordre partitures no és al PATH de la usuària" }
          # una partitura de la professora: en repetir l'instal·lador no s'ha de tocar
          Set-Content "$W\eixida\no-tocar.txt" "partitura de la professora"
          Set-Content "$W\.opencode\AGENTS.md" "vell"
      - name: Repetir el programa no ha de fer res nou, ni fallar
        shell: pwsh
        run: |
          $exe = Get-Item "$env:ARRANJAMENTS\Arranjaments-Windows.exe"
          $reg = "$env:RUNNER_TEMP\captures\windows-registre2.txt"
          $p = Start-Process $exe.FullName -ArgumentList "--auto --registre `"$reg`"" -Wait -PassThru
          $text = Get-Content $reg -Raw -Encoding UTF8
          Write-Host $text
          if ($p.ExitCode -ne 0) { throw "La segona vegada ha eixit amb codi $($p.ExitCode)" }
          if ($text -notmatch "OpenCode ja est") { throw "No diu que OpenCode ja hi és" }
          if ($text -notmatch "MuseScore ja est") { throw "No diu que MuseScore ja hi és" }
          if ($text -match "@@") { throw "Els avisos de progrés no s'han de veure al registre" }
      - name: Les partitures continuen igual i la configuració amagada s'ha renovat
        shell: pwsh
        run: |
          $W = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Arranjaments"
          if ((Get-Content "$W\eixida\no-tocar.txt" -Raw).Trim() -ne "partitura de la professora") { throw "S'ha tocat una partitura" }
          if (@(Get-ChildItem "$W\eixida" -Force).Count -ne 1) { throw "eixida ha canviat" }
          if ((Get-FileHash "$W\.opencode\AGENTS.md").Hash -ne (Get-FileHash "$env:REF\AGENTS.md").Hash) { throw "La configuració amagada no s'ha renovat" }
          $totes = (Get-ChildItem $W -Force | Sort-Object Name | ForEach-Object Name) -join " "
          if ($totes -ne ".opencode eixida entrada") { throw "Contingut inesperat: $totes" }
      - name: Arquitectura de cada peça (ARM64 o x64)
        shell: pwsh
        run: |
          function Maquina($f) {
              $b = [IO.File]::ReadAllBytes($f)
              $pe = [BitConverter]::ToInt32($b, 0x3C)
              switch ([BitConverter]::ToUInt16($b, $pe + 4)) { 0xAA64 { "arm64" } 0x8664 { "x64" } 0x14C { "x86" } default { "?" } }
          }
          $arq = [string][System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $D = Join-Path $env:LOCALAPPDATA "Arranjaments"
          $oc = @(Get-ChildItem "$env:LOCALAPPDATA\Programs\*\OpenCode.exe")[0].FullName
          $ms = @(Get-ChildItem "$env:ProgramFiles\MuseScore*\bin\MuseScore*.exe")[0].FullName
          $py = (& "$D\.venv\Scripts\python.exe" -c "import platform,sys;print(platform.machine(), sys.version.split()[0])")
          $uv = "$env:USERPROFILE\.local\bin\uv.exe"
          Write-Host "Sistema: $arq"
          Write-Host "OpenCode: $(Maquina $oc)"
          Write-Host "MuseScore: $(Maquina $ms) ($ms)"
          Write-Host "uv: $(Maquina $uv)"
          Write-Host "Python de les eines: $py"
          Write-Host "pythonw de la icona: $(Maquina "$D\.venv\Scripts\pythonw.exe")"
          if ($arq -eq "Arm64") {
              if ((Maquina $oc) -ne "arm64") { throw "A Windows ARM64, OpenCode hauria de ser la versió ARM64" }
              if ((Maquina "$D\.venv\Scripts\pythonw.exe") -ne (Maquina "$D\.venv\Scripts\python.exe")) { throw "pythonw i python no coincideixen" }
          } elseif ((Maquina $oc) -ne "x64") { throw "A Windows x64, OpenCode hauria de ser la versió x64" }
      - name: Comprovar el resultat
        shell: pwsh
        run: |
          $oc = @(Get-ChildItem "$env:LOCALAPPDATA\Programs\*\OpenCode.exe")
          if ($oc.Count -eq 0) { throw "Falta OpenCode.exe" }
          Write-Host "OpenCode: $($oc[0].FullName)"
          $ms = @(Get-ChildItem "$env:ProgramFiles\MuseScore*\bin\MuseScore*.exe")
          if ($ms.Count -eq 0) { throw "Falta MuseScore" }
          Write-Host "MuseScore: $($ms[0].FullName)"
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Arranjaments.lnk"
          if (-not (Test-Path $lnk)) { throw "Falta la icona $lnk" }
          $d = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Icona: $($d.TargetPath) $($d.Arguments) (carpeta de treball: $($d.WorkingDirectory))"
          if (-not (Test-Path $d.TargetPath)) { throw "La icona apunta a un fitxer que no existeix" }
          # la icona passa per l'actualitzador (Python sense finestra) i després obri OpenCode
          if ($d.TargetPath -notlike "*\.venv\Scripts\pythonw.exe") { throw "La icona no apunta a l'actualitzador" }
          if ($d.Arguments -notlike "*--obri*$($oc[0].FullName)*") { throw "La icona no obri OpenCode" }
          if ($d.WorkingDirectory -ne (Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Arranjaments")) { throw "La icona no treballa a la carpeta de treball" }
      - name: Obrir la icona de l'Escriptori i veure que arrenca OpenCode
        continue-on-error: true
        shell: pwsh
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Arranjaments.lnk"
          Start-Process $lnk
          $p = $null
          for ($i = 0; $i -lt 20 -and -not $p; $i++) { Start-Sleep 2; $p = Get-Process OpenCode -ErrorAction SilentlyContinue }
          if (-not $p) { throw "OpenCode no ha arrencat" }
          Stop-Process -Name OpenCode -Force -ErrorAction SilentlyContinue
      - name: Actualització silenciosa (simulada), fitxers de la professora intactes i tornar enrere
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $W = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Arranjaments"
          $D = Join-Path $env:LOCALAPPDATA "Arranjaments"
          $Py = Join-Path $D ".venv\Scripts\python.exe"
          $Ordre = "$env:USERPROFILE\.local\bin\partitures.cmd"
          function Llig($f) { (Get-Content $f -Raw).Trim() }
          function Url($ruta) { ([Uri]$ruta).AbsoluteUri }
          if ((Llig "$D\VERSION") -ne (Llig "$env:REF\VERSION")) { throw "VERSION no coincideix" }
          $V0 = Llig "$D\VERSION"
          # la icona ha d'executar l'actualitzador abans d'obrir OpenCode
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) "Arranjaments.lnk"))
          if ($lnk.TargetPath -notlike "*pythonw.exe" -or $lnk.Arguments -notlike "*partitures.actualitzar*--obri*OpenCode.exe*") { throw "La icona no passa per l'actualitzador: $($lnk.TargetPath) $($lnk.Arguments)" }
          $F = Join-Path $env:RUNNER_TEMP "fals"; $S = Join-Path $env:RUNNER_TEMP "servidor"
          Remove-Item $F, $S, "$S-mal" -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive (Join-Path $env:RUNNER_TEMP "actualitzacio.zip") $F
          Set-Content "$F\scripts\partitures\marca_prova.txt" "marca"
          Add-Content "$F\AGENTS.md" "LINIA-DE-PROVA"
          & $Py -m partitures.actualitzar --fes-paquet $F 99.0.0 $S
          Set-Content "$W\eixida\no-tocar.txt" "partitura de la professora"
          # sha256 incorrecte: es rebutja i no canvia res
          Copy-Item $S "$S-mal" -Recurse
          $j = Get-Content "$S-mal\versio.json" -Raw | ConvertFrom-Json; $j.sha256 = "0" * 64
          [IO.File]::WriteAllText("$S-mal\versio.json", ($j | ConvertTo-Json), (New-Object Text.UTF8Encoding $false))
          $env:ARRANJAMENTS_ACTUALITZACIO_URL = Url "$S-mal"
          & $Ordre actualitzar
          if ($LASTEXITCODE -eq 0) { throw "Hauria de rebutjar el paquet amb sha256 incorrecte" }
          if ((Llig "$D\VERSION") -ne $V0) { throw "S'ha canviat amb un sha256 incorrecte" }
          # sense internet: la icona obri igualment, sense error
          $env:ARRANJAMENTS_ACTUALITZACIO_URL = "file:///C:/no/hi/ha/res"
          & $Py -I -m partitures.actualitzar --silenci
          if ($LASTEXITCODE -ne 0) { throw "L'actualitzador ha fallat sense internet" }
          if (-not (Select-String -Path "$D\actualitzacio.log" -Pattern "Sense connexi" -Quiet)) { throw "No s'ha registrat la falta de connexió" }
          # la mateixa ordre que executa la icona
          $env:ARRANJAMENTS_ACTUALITZACIO_URL = Url $S
          & $Py -I -m partitures.actualitzar --silenci
          if ((Llig "$D\VERSION") -ne "99.0.0") { throw "No s'ha actualitzat: $(Get-Content "$D\actualitzacio.log" -Raw)" }
          if (-not (Test-Path "$D\scripts\partitures\marca_prova.txt")) { throw "Falta la marca" }
          if (-not (Test-Path "$D\anterior\ESTAT.json")) { throw "Falta anterior" }
          if (-not (Select-String -Path "$W\.opencode\AGENTS.md" -Pattern "LINIA-DE-PROVA" -Quiet)) { throw "AGENTS.md no s'ha renovat" }
          if ((Llig "$W\eixida\no-tocar.txt") -ne "partitura de la professora") { throw "S'ha tocat una partitura" }
          $tot = (Get-ChildItem $W -Force | Sort-Object Name | ForEach-Object Name) -join " "
          if ($tot -ne ".opencode eixida entrada") { throw "Contingut inesperat: $tot" }
          $env:ARRANJAMENTS_ACTUALITZACIO_URL = ""
          & $Ordre versio
          & $Ordre comprovar
          if ($LASTEXITCODE -ne 0) { throw "comprovar ha fallat després d'actualitzar" }
          # tornar enrere
          & $Ordre actualitzar --torna-enrere
          if ($LASTEXITCODE -ne 0) { throw "tornar enrere ha fallat" }
          if ((Llig "$D\VERSION") -ne $V0) { throw "No s'ha tornat a $V0" }
          if (Test-Path "$D\scripts\partitures\marca_prova.txt") { throw "La marca continua" }
          if ((Get-FileHash "$W\.opencode\AGENTS.md").Hash -ne (Get-FileHash "$env:REF\AGENTS.md").Hash) { throw "AGENTS.md no s'ha restaurat" }
          if ((Llig "$W\eixida\no-tocar.txt") -ne "partitura de la professora") { throw "S'ha tocat una partitura" }
          & $Ordre comprovar
          if ($LASTEXITCODE -ne 0) { throw "comprovar ha fallat després de tornar enrere" }
          $env:ARRANJAMENTS_ACTUALITZACIO_URL = Url $S
          & $Py -I -m partitures.actualitzar --silenci
          if ((Llig "$D\VERSION") -ne $V0) { throw "S'ha tornat a actualitzar a la versió rebutjada" }
      - name: Sense el fitxer baixat, les ordres funcionen des de la carpeta de treball
        shell: pwsh
        run: |
          Remove-Item "C:\Prova àè amb espais" -Recurse -Force
          $W = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Arranjaments"
          Set-Location $W
          # com ho escriu l'ajudant dins d'OpenCode quan l'ordre encara no és al PATH
          function P { & "$env:USERPROFILE\.local\bin\partitures.cmd" @args; if ($LASTEXITCODE -ne 0) { throw "partitures $args ha fallat ($LASTEXITCODE)" } }
          P comprovar
          P corpus bach --copia 1
          Get-ChildItem entrada | ForEach-Object Name
          P info "entrada/bwv101.7.musicxml"
          P transport "entrada/bwv101.7.musicxml" --semitons 2
          if (-not (Test-Path "eixida\bwv101.7-transportat.musicxml")) { throw "No s'ha creat el fitxer transportat" }
          P instruments "entrada/bwv101.7.musicxml" --assigna "1=trompeta-sib,2=trompeta-sib,3=trompa-fa,4=trombo"
          # mai fora d'entrada i eixida
          & "$env:USERPROFILE\.local\bin\partitures.cmd" transport "entrada/bwv101.7.musicxml" --semitons 2 --eixida "../fora.musicxml"
          if ($LASTEXITCODE -eq 0 -or (Test-Path "..\fora.musicxml")) { throw "Ha escrit fora de la carpeta de treball" }
          P instalar --prova
          # i amb el nom curt, com queda després d'obrir una sessió nova (PATH de la usuària)
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          cmd /c "partitures comprovar"
          if ($LASTEXITCODE -ne 0) { throw "partitures comprovar (nom curt) ha fallat" }
          if ((Get-Content "eixida\no-tocar.txt" -Raw).Trim() -ne "partitura de la professora") { throw "S'ha tocat una partitura" }
          $totes = (Get-ChildItem $W -Force | Sort-Object Name | ForEach-Object Name) -join " "
          if ($totes -ne ".opencode eixida entrada") { throw "Contingut inesperat: $totes" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-instalacio-${{ matrix.os }}
          path: ${{ runner.temp }}/captures/
          if-no-files-found: warn

  # Linux (LliureX és Ubuntu 22.04 a la versió 23 i Ubuntu 24.04 a la 25): baixar Arranjaments-LliureX.run, posar-lo en una
  # carpeta amb accents i espais, donar-li permís d'execució (com fa la professora) i executar-lo. Sense sudo per a instal·lar.
  # Es prova també en Linux ARM64 (ubuntu-24.04-arm). A 22.04 ARM64 no: l'AppImage aarch64 de MuseScore necessita glibc 2.38 o més nova.
  instalacio-linux:
    needs: paquet
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets
          path: ${{ runner.temp }}
      - name: Preparar un ordinador de professora (carpetes en castellà, sense FUSE) i el fitxer baixat
        run: |
          set -x
          uname -m
          # Només per a la prova (sudo): libegl1 i libopengl0 vénen amb qualsevol escriptori (el servidor del CI no els porta); carpetes Documentos i Escritorio, com un escriptori en castellà, xvfb per a mirar que OpenCode arrenca i xterm per a simular el doble clic
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdg-user-dirs xvfb xterm desktop-file-utils libegl1 libopengl0 libxcb-cursor0
          sudo apt-get purge -y libfuse2 libfuse2t64 fuse 2>/dev/null || true
          ldconfig -p | grep 'libfuse.so.2' || echo "Sense libfuse2: com un Ubuntu net"
          mkdir -p "$HOME/.config" "$HOME/Documentos" "$HOME/Escritorio"
          printf 'XDG_DOCUMENTS_DIR="$HOME/Documentos"\nXDG_DESKTOP_DIR="$HOME/Escritorio"\n' > "$HOME/.config/user-dirs.dirs"
          test "$(xdg-user-dir DOCUMENTS)" = "$HOME/Documentos"
          mkdir -p "$HOME/Prova àè amb espais"
          cp "$RUNNER_TEMP/Arranjaments-LliureX.run" "$HOME/Prova àè amb espais/"
          # el navegador no deixa el permís d'execució: la professora l'hi posa (clic dret, Propietats, Permisos)
          chmod -x "$HOME/Prova àè amb espais/Arranjaments-LliureX.run"
          test ! -x "$HOME/Prova àè amb espais/Arranjaments-LliureX.run"
          chmod +x "$HOME/Prova àè amb espais/Arranjaments-LliureX.run"
          mkdir -p "$RUNNER_TEMP/ref"
          unzip -q "$RUNNER_TEMP/actualitzacio.zip" -d "$RUNNER_TEMP/ref"
          echo "REF=$RUNNER_TEMP/ref" >> "$GITHUB_ENV"
          echo "RUN=$HOME/Prova àè amb espais/Arranjaments-LliureX.run" >> "$GITHUB_ENV"
      - name: Instal·lar amb el fitxer .run (sense terminal ni sudo)
        run: |
          set -o pipefail
          ARRANJAMENTS_PROGRES=1 "$RUN" --sense-preguntes </dev/null | tee "$RUNNER_TEMP/primera.txt"
          grep -q "Tot a punt" "$RUNNER_TEMP/primera.txt"
          grep -q "@@FI ok" "$RUNNER_TEMP/primera.txt"
          for p in uv opencode musescore eines carpeta icona final; do grep -q "@@PAS $p ok" "$RUNNER_TEMP/primera.txt"; done
          ! grep -q "falla" "$RUNNER_TEMP/primera.txt"
          test ! -e "$HOME/.local/share/Arranjaments/staging"
      - name: La carpeta de treball només té entrada i eixida; les eines i les aplicacions queden a part
        run: |
          set -x
          W="$HOME/Documentos/Arranjaments"
          D="$HOME/.local/share/Arranjaments"
          ls -la "$W" "$W/.opencode" "$D"
          test "$(ls "$W" | sort | tr '\n' ' ')" = "eixida entrada "
          test "$(ls -A "$W" | sort | tr '\n' ' ')" = ".opencode eixida entrada "
          test -f "$W/.opencode/opencode.json"
          cmp "$W/.opencode/AGENTS.md" "$REF/AGENTS.md"
          test -f "$W/.opencode/skills/arranjar/SKILL.md"
          test -x "$D/.venv/bin/python" && test -d "$D/scripts/partitures" && test -x "$HOME/.local/bin/partitures"
          test -x "$D/OpenCode/AppRun" && test -x "$D/MuseScore/AppRun"
          # arquitectura de cada peça (aarch64 o x86_64)
          uname -m
          file -L "$D/.venv/bin/python" "$D/OpenCode/opencode-desktop" "$D/MuseScore/bin/mscore" 2>/dev/null || true
          file -L "$D/OpenCode/AppRun" "$D/MuseScore/AppRun" || true
          # el menú d'aplicacions i l'Escriptori (en castellà: Escritorio)
          for f in "$HOME/.local/share/applications/arranjaments.desktop" "$HOME/Escritorio/Arranjaments.desktop"; do
            test -x "$f"
            grep -q '^Name=Arranjaments$' "$f"
            grep -q "^Path=$W$" "$f"
            desktop-file-validate "$f"
            ICONA="$(sed -n 's/^Icon=//p' "$f")"; echo "Icona: $ICONA"
            L="$(sed -n 's/^Exec="\(.*\)"$/\1/p' "$f")"; test -x "$L"
          done
          test -x "$D/arranjaments-obrir.sh"
          gio info -a metadata::trusted "$HOME/Escritorio/Arranjaments.desktop" || true
          # una partitura de la professora: en repetir l'instal·lador no s'ha de tocar
          echo "partitura de la professora" > "$W/eixida/no-tocar.txt"
          echo "vell" > "$W/.opencode/AGENTS.md"
      - name: Repetir l'instal·lador no ha de fer res nou, ni fallar, ni tocar les partitures
        run: |
          set -o pipefail
          "$RUN" --sense-preguntes | tee segona.txt
          grep -q "OpenCode ja està instal·lat" segona.txt
          grep -q "MuseScore ja està instal·lat" segona.txt
          grep -q "uv ja està instal·lat" segona.txt
          W="$HOME/Documentos/Arranjaments"
          test "$(cat "$W/eixida/no-tocar.txt")" = "partitura de la professora"
          test "$(ls -A "$W/eixida")" = "no-tocar.txt"
          cmp "$W/.opencode/AGENTS.md" "$REF/AGENTS.md"
          test "$(ls -A "$W" | sort | tr '\n' ' ')" = ".opencode eixida entrada "
          test ! -e "$HOME/.local/share/Arranjaments/staging"
          "$RUN" --sense-preguntes --prova | tee prova.txt
          # tot al seu lloc (Audiveris és opcional i només es mira a part)
          ! grep "\[falta\]" prova.txt | grep -v Audiveris | grep .
      - name: Doble clic simulat (informatiu, xvfb, sense terminal però amb pantalla)
        continue-on-error: true
        run: |
          # stdout no és un terminal (com amb el doble clic) i hi ha pantalla: el .run s'ha de tornar a obrir dins d'un terminal
          xvfb-run -a "$RUN" --sense-preguntes > "$RUNNER_TEMP/doble-clic.txt" 2>&1
          cat "$RUNNER_TEMP/doble-clic.txt"
          grep -q "Obrint en un terminal: xterm" "$RUNNER_TEMP/doble-clic.txt"
          test ! -e "$HOME/.local/share/Arranjaments/staging"
      - name: OpenCode arrenca des de la icona (informatiu; xvfb, sense pantalla)
        continue-on-error: true
        run: |
          L="$HOME/.local/share/Arranjaments/arranjaments-obrir.sh"
          cat "$L"
          xvfb-run -a sh -c '"$0" --disable-gpu >"$RUNNER_TEMP/opencode.log" 2>&1 & p=$!; sleep 25; kill -0 $p && echo "OpenCode segueix obert" ; kill $p 2>/dev/null; wait $p 2>/dev/null; true' "$L"
          tail -20 "$RUNNER_TEMP/opencode.log" || true
      - name: Actualització silenciosa (simulada), fitxers de la professora intactes i tornar enrere
        run: |
          set -ex
          W="$HOME/Documentos/Arranjaments"
          D="$HOME/.local/share/Arranjaments"
          PY="$D/.venv/bin/python"
          grep -q actualitzar "$D/arranjaments-obrir.sh"
          test "$(cat "$D/VERSION")" = "$(cat "$REF/VERSION")"
          V0="$(cat "$D/VERSION")"
          # el paquet «nou»: el real, amb una marca i una versió molt alta
          F="$RUNNER_TEMP/fals"; rm -rf "$F" "$RUNNER_TEMP/servidor" "$RUNNER_TEMP/servidor-mal"; mkdir -p "$F"
          unzip -q "$RUNNER_TEMP/actualitzacio.zip" -d "$F"
          echo "marca" > "$F/scripts/partitures/marca_prova.txt"
          echo "LINIA-DE-PROVA" >> "$F/AGENTS.md"
          "$PY" -m partitures.actualitzar --fes-paquet "$F" 99.0.0 "$RUNNER_TEMP/servidor"
          echo "partitura de la professora" > "$W/eixida/no-tocar.txt"
          # sha256 incorrecte: es rebutja i no canvia res
          cp -R "$RUNNER_TEMP/servidor" "$RUNNER_TEMP/servidor-mal"
          "$PY" -c "import json,sys;p=sys.argv[1];d=json.load(open(p));d['sha256']='0'*64;json.dump(d,open(p,'w'))" "$RUNNER_TEMP/servidor-mal/versio.json"
          if ARRANJAMENTS_ACTUALITZACIO_URL="file://$RUNNER_TEMP/servidor-mal" "$HOME/.local/bin/partitures" actualitzar; then echo "Hauria de rebutjar-ho"; exit 1; fi
          test "$(cat "$D/VERSION")" = "$V0"
          # sense internet: la icona obri igualment, sense error
          ARRANJAMENTS_ACTUALITZACIO_URL="file:///no/hi/ha/res" "$PY" -I -m partitures.actualitzar --silenci
          grep -q "Sense connexió" "$D/actualitzacio.log"
          test "$(cat "$D/VERSION")" = "$V0"
          # la mateixa ordre que executa la icona
          ARRANJAMENTS_ACTUALITZACIO_URL="file://$RUNNER_TEMP/servidor" "$PY" -I -m partitures.actualitzar --silenci
          test "$(cat "$D/VERSION")" = "99.0.0"
          test -f "$D/scripts/partitures/marca_prova.txt"
          test -f "$D/anterior/ESTAT.json"
          grep -q "LINIA-DE-PROVA" "$W/.opencode/AGENTS.md"
          test -f "$W/.opencode/NOVETATS.md"
          test "$(cat "$W/eixida/no-tocar.txt")" = "partitura de la professora"
          test "$(ls -A "$W" | sort | tr '\n' ' ')" = ".opencode eixida entrada "
          test "$(ls -A "$W/.opencode" | sort | tr '\n' ' ')" = "AGENTS.md NOVETATS.md opencode.json skills "
          P() { env -i HOME="$HOME" PATH=/usr/bin:/bin "$HOME/.local/bin/partitures" "$@"; }
          P versio | grep -q "99.0.0"
          P comprovar
          # tornar enrere
          P actualitzar --torna-enrere
          test "$(cat "$D/VERSION")" = "$V0"
          test ! -e "$D/scripts/partitures/marca_prova.txt"
          ! grep -q "LINIA-DE-PROVA" "$W/.opencode/AGENTS.md"
          cmp "$W/.opencode/AGENTS.md" "$REF/AGENTS.md"
          test "$(cat "$W/eixida/no-tocar.txt")" = "partitura de la professora"
          P comprovar
          # i la icona no torna a posar la versió que s'ha rebutjat
          ARRANJAMENTS_ACTUALITZACIO_URL="file://$RUNNER_TEMP/servidor" "$PY" -I -m partitures.actualitzar --silenci
          test "$(cat "$D/VERSION")" = "$V0"
      - name: Sense el fitxer baixat, les ordres funcionen des de la carpeta de treball (i MuseScore fa un PDF sense pantalla)
        run: |
          set -x
          rm -rf "$HOME/Prova àè amb espais"
          cd "$HOME/Documentos/Arranjaments"
          # com ho fa l'ajudant dins d'OpenCode: amb un entorn mínim, sense uv al PATH
          P() { env -i HOME="$HOME" PATH=/usr/bin:/bin "$HOME/.local/bin/partitures" "$@"; }
          P comprovar | tee "$RUNNER_TEMP/comprovar.txt"
          grep -q "MuseScore" "$RUNNER_TEMP/comprovar.txt"
          P corpus bach --copia 1
          ls entrada
          P info "entrada/bwv101.7.musicxml"
          P transport "entrada/bwv101.7.musicxml" --semitons 2
          test -f "eixida/bwv101.7-transportat.musicxml"
          # El servidor del CI no té pantalla. MuseScore (Qt 6) no fa cas de QT_QPA_PLATFORM=offscreen i demana pantalla: es dona una de virtual (xvfb).
          xvfb-run -a "$HOME/.local/bin/partitures" exportar "entrada/bwv101.7.musicxml"
          find eixida -name '*.pdf' | tee "$RUNNER_TEMP/pdfs.txt"
          test -s "$RUNNER_TEMP/pdfs.txt"
          test "$(find eixida -name '*.pdf' -size 0 | wc -l)" = 0
          # mai fora d'entrada i eixida
          if P transport "entrada/bwv101.7.musicxml" --semitons 2 --eixida "../fora.musicxml"; then echo "Ha escrit fora"; exit 1; fi
          test ! -e ../fora.musicxml
          P instalar --prova
          test "$(cat eixida/no-tocar.txt)" = "partitura de la professora"
          test "$(ls -A | sort | tr '\n' ' ')" = ".opencode eixida entrada "

  # Només quan tot ha anat bé a main: es publiquen els fitxers a «Releases», sempre amb els mateixos enllaços:
  # https://github.com/<repo>/releases/latest/download/Arranjaments-Windows.exe (o -Mac.dmg, -LliureX.run, arranjaments.zip)
  publicar:
    needs: [paquet, paquet-mac, instalacio-mac, instalacio-windows, instalacio-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publicar
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquets
      - uses: actions/download-artifact@v4
        with:
          name: dmg
      - name: Publicar els fitxers (versió «ultima», que es va renovant)
        run: |
          set -x
          ls -la
          test -s Arranjaments-Windows.exe && test -s Arranjaments-Mac.dmg && test -s Arranjaments-LliureX.run && test -s arranjaments.zip
          cat > notes.md <<NOTES
          Baixa **un sol fitxer** per al teu ordinador i fes-hi doble clic:

          - Windows: **Arranjaments-Windows.exe**
          - Mac: **Arranjaments-Mac.dmg**
          - LliureX i altres Linux: **Arranjaments-LliureX.run**

          Les instruccions són al [README](https://github.com/$GH_REPO#readme). **arranjaments.zip** és el projecte complet (la manera antiga d'instal·lar); actualitzacio.zip i versio.json els usa l'actualització automàtica.

          Fet automàticament a partir de la versió $GITHUB_SHA, després de provar la instal·lació en un Mac Apple Silicon, un Mac Intel, un Windows x64, un Windows 11 ARM64 i tres Linux nets (Ubuntu 22.04 x64, 24.04 x64 i 24.04 ARM64).
          NOTES
          FITXERS="arranjaments.zip actualitzacio.zip Arranjaments-Windows.exe Arranjaments-Mac.dmg Arranjaments-LliureX.run"
          if gh release view ultima >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/ultima" -f sha="$GITHUB_SHA" -F force=true
            gh release upload ultima $FITXERS --clobber
            # versio.json l'últim: quan apareix, el paquet ja hi és
            gh release upload ultima versio.json --clobber
            gh release edit ultima --title "Arranjaments" --notes-file notes.md --latest
          else
            gh release create ultima $FITXERS versio.json --target "$GITHUB_SHA" --title "Arranjaments" --notes-file notes.md --latest
          fi
